
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <title>Join TBO</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f6fa;
      background:
        radial-gradient(ellipse at 50% 0%, #17254b 0%, transparent 55%),
        #08090d;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px;
      border: 1px solid #252936;
      border-radius: 22px;
      background: rgba(15, 17, 24, 0.94);
      box-shadow: 0 25px 100px #0009, 0 0 50px #315bff0a;
    }

    .brand {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }

    .brand img {
      width: 110px;
      height: 64px;
      object-fit: contain;
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 28px;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 0 0 30px;
      color: #9298a8;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 18px 0 9px;
      color: #dfe2eb;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #2a2e3a;
      border-radius: 10px;
      outline: none;
      background: #0b0d13;
      color: white;
      font: inherit;
      font-size: 14px;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      border-color: #6684ff;
      box-shadow: 0 0 0 3px #5876ff20;
    }

    input::placeholder {
      color: #626878;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 58px;
    }

    .toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #969db0;
      cursor: pointer;
      font-size: 12px;
    }

    .submit {
      width: 100%;
      margin-top: 26px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: linear-gradient(110deg, #4169ff, #7453ee);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 25px #4e5dff30;
      transition: transform .2s, filter .2s;
    }

    .submit:hover {
      transform: translateY(-2px);
      filter: brightness(1.13);
    }

    .submit:active {
      transform: scale(.99);
    }

    .terms {
      margin: 17px 0 0;
      color: #777e8e;
      font-size: 11px;
      text-align: center;
      line-height: 1.7;
    }

    .terms a, .signin a {
      color: #8ca2ff;
      text-decoration: none;
    }

    .signin {
      margin: 25px 0 0;
      padding-top: 22px;
      border-top: 1px solid #252936;
      color: #9298a8;
      text-align: center;
      font-size: 13px;
    }

    .signin a {
      margin-left: 4px;
      font-weight: 600;
    }

    .message {
      display: none;
      margin-top: 16px;
      color: #ffb4b4;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 28px 22px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="./logohs.svg" alt="TBO">
    </div>

    <h1>Create your account</h1>
    <p class="subtitle">
      Your next chapter starts here.<br>
      Join TBO today.
    </p>

    <form id="signup">
      <label for="email">Email address</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <div class="password-wrap">
        <input
          id="password"
          name="password"
          type="password"
          placeholder="At least 8 characters"
          minlength="8"
          autocomplete="new-password"
          required
        >
        <button class="toggle" type="button" id="toggle">
          Show
        </button>
      </div>

      <button class="submit" type="submit">
        Create account &nbsp; →
      </button>

      <p class="message" id="message"></p>
    </form>

    <p class="terms">
      By continuing, you agree to our
      <a href="./terms.html">Terms of Service</a>
      and <a href="./privacy.html">Privacy Policy</a>.
    </p>

    <p class="signin">
      Already have an account?
      <a href="./login.html">Sign in</a>
    </p>
  </main>

  <script>
    const password = document.getElementById("password");
    const toggle = document.getElementById("toggle");
    const form = document.getElementById("signup");
    const message = document.getElementById("message");

    toggle.addEventListener("click", () => {
      const hidden = password.type === "password";
      password.type = hidden ? "text" : "password";
      toggle.textContent = hidden ? "Hide" : "Show";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      message.style.display = "block";
      message.textContent =
        "The signup service isn't connected yet. Please try again later.";
    });
  </script>
</body>
</html>
