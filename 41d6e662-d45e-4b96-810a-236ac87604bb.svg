<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 688 224" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">TBO</title>
  <defs>
    <!-- letter shapes -->
    <path id="T" fill-rule="evenodd" clip-rule="evenodd"
      d="M0 0H190V54H123V200H67V54H0Z"/>
    <path id="B" fill-rule="evenodd" clip-rule="evenodd" transform="translate(-15 0)"
      d="M230 0H335C380 0 408 25 408 62C408 87 395 104 374 113C402 121 424 142 424 152C424 182 394 200 346 200H230Z
         M288 42V79H326C340 79 348 71 348 60.5C348 50 340 42 326 42Z
         M288 121V158H335C350 158 358 150 358 139.5C358 129 350 121 335 121Z"/>
    <path id="O" fill-rule="evenodd" clip-rule="evenodd"
      d="M552 0C614 0 664 40 664 100C664 160 614 200 552 200C490 200 440 160 440 100C440 40 490 0 552 0Z
         M552 44C521 44 496 66 496 100C496 134 521 156 552 156C583 156 608 134 608 100C608 66 583 44 552 44Z"/>

    <!-- diagonal stripe zones, one per letter -->
    <clipPath id="band">
      <polygon points="160,-12 290,-12 60,224 -70,224"/>
      <polygon points="375,-12 505,-12 275,224 145,224"/>
      <polygon points="600,-12 730,-12 500,224 370,224"/>
    </clipPath>
    <!-- keeps stripes inside the letters -->
    <clipPath id="letters">
      <use href="#T"/><use href="#B"/><use href="#O"/>
    </clipPath>
    <!-- black stripes -->
    <pattern id="stripes" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <rect width="9" height="4.6" fill="#000000"/>
    </pattern>
  </defs>

  <!-- white letters with thin black outline -->
  <g fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round" paint-order="stroke">
    <use href="#T"/><use href="#B"/><use href="#O"/>
  </g>

  <!-- black diagonal stripes -->
  <g clip-path="url(#letters)">
    <g clip-path="url(#band)">
      <rect x="-12" y="-12" width="688" height="224" fill="url(#stripes)"/>
    </g>
  </g>
</svg>
